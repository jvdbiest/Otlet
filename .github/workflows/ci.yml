# SPDX-License-Identifier: AGPL-3.0-or-later
# Continuous integration (B04, ADR-0015). Every check is blocking, except the
# job on the newest Python, which is informational (ADR-0016). The jobs call
# repository commands; only first-party GitHub actions are used.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.0"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  dco:
    name: Signature DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier les « Signed-off-by »
        run: >-
          python3 tools/check_dco.py
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  backend:
    name: Back-end (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
        informational: [false]
        include:
          - os: ubuntu-latest
            python: "3.15"
            informational: true
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer uv
        run: pipx install "uv==${{ env.UV_VERSION }}"
      - uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py${{ matrix.python }}-
      - name: Installer les dépendances (verrou exact)
        run: uv sync --locked
      - name: Lint (ruff check)
        run: uv run ruff check . ../tools
      - name: Format (ruff format)
        run: uv run ruff format --check . ../tools
      - name: Typage (mypy --strict)
        run: uv run mypy
      - name: Contrats d'imports (import-linter)
        run: uv run lint-imports
      - name: Tests (pytest)
        run: uv run pytest
      - name: Réduire le cache uv
        if: always()
        run: uv cache prune --ci

  integration:
    name: Intégration PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otlet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UV_PYTHON: "3.13"
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      OTLET_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/otlet_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer uv
        run: pipx install "uv==${{ env.UV_VERSION }}"
      - uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py3.13-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py3.13-
      - name: Installer les dépendances (verrou exact)
        run: uv sync --locked
      - name: Tests avec PostgreSQL réel (rôles M-12, migrations), aucun ignoré faute de base
        run: |
          uv run pytest -rs | tee "$RUNNER_TEMP/pytest.txt"
          ! grep -q "OTLET_TEST_ADMIN_URL not set" "$RUNNER_TEMP/pytest.txt"

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer uv
        run: pipx install "uv==${{ env.UV_VERSION }}"
      - name: Python (pip-audit sur le verrou exact, empreintes exigées)
        working-directory: backend
        run: |
          uv export --frozen --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx "pip-audit==${{ env.PIP_AUDIT_VERSION }}" --strict --require-hashes --disable-pip             --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Interface (npm audit sur le verrou)
        working-directory: frontend
        run: npm audit --audit-level=moderate

  licences:
    name: Licences des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer uv
        run: pipx install "uv==${{ env.UV_VERSION }}"
      - name: Python (environnement d'exécution, sans les outils de développement)
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/runtime
          UV_PYTHON: "3.13"
        run: |
          uv sync --locked --no-dev
          "$UV_PROJECT_ENVIRONMENT/bin/python" ../tools/check_licenses.py python
      - name: Interface (paquets livrés dans le bundle)
        run: python3 tools/check_licenses.py npm frontend/package-lock.json

  frontend:
    name: Interface (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances (verrou exact)
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typage (tsc)
        run: npm run typecheck
      - name: Construction (vite build)
        run: npm run build
      - name: Concordance de l'éditeur avec le moteur de rendu (ADR-0023)
        run: npm run concordance

  image:
    name: Image OCI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Construire l'image multirôle
        run: docker build -f deploy/Containerfile -t otlet:ci .
      - name: Vérifier l'image (rôles, non root, sans Node.js)
        run: sh deploy/ci/check-image.sh otlet:ci

  compose:
    name: Pile Compose solo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Générer la configuration locale
        run: |
          sh deploy/configure.sh localhost
          sudo chown 10001:10001 deploy/keys/secrets-private.pem
      - name: Démarrer la pile (construction comprise)
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 300
      - name: Vérifier la pile (HTTPS, interface, santé)
        run: sh deploy/ci/check-compose.sh
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - name: Arrêter la pile
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  upgrade:
    name: Mise à jour et retour arrière
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Jouer le scénario (docs/exploitation/mise-a-jour.md)
        run: sh spikes/s6-delivery/upgrade-rollback.sh
      - name: Conserver le résultat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s6-upgrade-rollback
          path: spikes/s6-delivery/results/
          if-no-files-found: ignore

  secrets:
    name: Séparation des secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Jouer le scénario (rapport S6, critère C3)
        run: sh spikes/s6-delivery/secrets-separation.sh
      - name: Conserver le résultat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s6-secrets-separation
          path: spikes/s6-delivery/results/
          if-no-files-found: ignore
