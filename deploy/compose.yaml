# Solo topology (ARCHITECTURE §20.1): Caddy, API, worker, PostgreSQL on one server.
# Works with Docker Engine (docker compose) and Podman (podman compose).
# Configuration: .env next to this file, generated by configure.sh (see .env.example).

name: otlet

x-app: &app
  image: ${OTLET_IMAGE:-otlet}:${OTLET_VERSION:-dev}
  build:
    context: ..
    dockerfile: deploy/Containerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${OTLET_HTTP_PORT:-80}:80"
      - "${OTLET_HTTPS_PORT:-443}:443"
      - "${OTLET_HTTPS_PORT:-443}:443/udp"
    environment:
      OTLET_DOMAIN: ${OTLET_DOMAIN:?OTLET_DOMAIN is required (see .env.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin endpoint only listens inside the container.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    healthcheck:
      test: ["CMD", "otlet", "healthcheck", "api"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "otlet", "healthcheck", "worker"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: otlet
      POSTGRES_USER: otlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otlet -d otlet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
  db_data:
