[project]
name = "otlet"
version = "0.0.0"
description = "Plateforme open source de veille, de rédaction sourcée et de publication assistée par IA"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "Joël" }]
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otlet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_package = "otlet"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-independence"
name = "Le domaine ne dépend d'aucun cadre ni d'aucune bibliothèque d'infrastructure"
type = "forbidden"
source_modules = ["otlet.**.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "alembic", "psycopg", "procrastinate", "httpx", "openai", "anthropic"]

[[tool.importlinter.contracts]]
id = "module-layers"
name = "Couches de chaque module : adapters, puis application, puis domain"
type = "layers"
containers = ["otlet.*"]
layers = ["(adapters)", "(application)", "(domain)"]

[[tool.importlinter.contracts]]
id = "entrypoints-on-top"
name = "Seuls les points d'entrée importent otlet.entrypoints"
type = "protected"
protected_modules = ["otlet.entrypoints"]
allowed_importers = ["otlet.entrypoints"]

[[tool.importlinter.contracts]]
id = "ai-sdks-gateway-only"
name = "SDK des fournisseurs IA interdits tant que la passerelle n'existe pas (MD4)"
type = "forbidden"
source_modules = ["otlet"]
forbidden_modules = ["openai", "anthropic"]
