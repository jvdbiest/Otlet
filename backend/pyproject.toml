[project]
name = "otlet"
version = "0.0.0"
description = "Plateforme open source de veille, de rédaction sourcée et de publication assistée par IA"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "Joël" }]
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=0.40",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx2>=2.13.1",
    "nh3>=0.3.7",
    "openai>=1.50",
    "pillow>=13,<14",
    "procrastinate~=3.10.0",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.6",
    "python-docx>=1.2,<2",
    "readability-lxml>=0.9",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
    "weasyprint>=70,<71",
]

[project.scripts]
otlet = "otlet.entrypoints.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.169.0",
    "import-linter>=2.15",
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otlet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
# Explicit, because the pre-commit hook runs ruff from the repository root, where `src`
# would not resolve to backend/src.
known-first-party = ["otlet", "integration_support", "ai_support", "conftest"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# The stores build SQL from constants of the module (columns, the workspace predicate of
# otlet.platform.rls.here); values always travel as bound parameters.
"**/adapters/*postgres.py" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "tests"

# Libraries of the collection without type information (U01).
[[tool.mypy.overrides]]
module = ["feedparser", "readability", "lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_package = "otlet"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-independence"
name = "Le domaine ne dépend d'aucun cadre ni d'aucune bibliothèque d'infrastructure"
type = "forbidden"
source_modules = ["otlet.**.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "alembic", "psycopg", "procrastinate", "httpx", "httpx2", "httpcore2", "feedparser", "lxml", "nh3", "readability", "openai", "anthropic", "PIL"]

[[tool.importlinter.contracts]]
id = "module-layers"
name = "Couches de chaque module : adapters, puis application, puis domain"
type = "layers"
containers = ["otlet.*"]
layers = ["(adapters)", "(application)", "(domain)"]

[[tool.importlinter.contracts]]
id = "entrypoints-on-top"
name = "Seuls les points d'entrée importent otlet.entrypoints"
type = "protected"
protected_modules = ["otlet.entrypoints"]
allowed_importers = ["otlet.entrypoints"]

[[tool.importlinter.contracts]]
id = "secrets-worker-only"
name = "L'API n'importe pas le déchiffrement des secrets (DR6)"
type = "forbidden"
source_modules = ["otlet.entrypoints.api"]
forbidden_modules = ["otlet.platform.secrets.opening"]

[[tool.importlinter.contracts]]
id = "ai-sdks-gateway-only"
name = "Seuls les adaptateurs IA importent les SDK des fournisseurs (MD4)"
type = "forbidden"
source_modules = ["otlet"]
forbidden_modules = ["openai", "anthropic"]
ignore_imports = ["otlet.ai.adapters.providers -> openai", "otlet.ai.adapters.providers -> anthropic"]

[[tool.importlinter.contracts]]
id = "procrastinate-jobs-only"
name = "Seul le module jobs importe Procrastinate (ADR-0022)"
type = "forbidden"
source_modules = ["otlet"]
forbidden_modules = ["procrastinate"]
ignore_imports = ["otlet.jobs.** -> procrastinate"]
