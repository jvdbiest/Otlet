# SPDX-License-Identifier: AGPL-3.0-or-later
# Solo topology (ARCHITECTURE §20.1): Caddy, API, worker, scheduler, PostgreSQL on one server.
# Works with Docker Engine (docker compose) and Podman (podman compose).
# Configuration: .env next to this file, generated by configure.sh (see .env.example).
#
# Start-up order: db, then backup (complete backup before any change), then provision (roles of M-12), then
# migrate (one-shot), then api, worker and scheduler, then caddy. See docs/exploitation/mise-a-jour.md.

name: otlet

x-app: &app
  image: ${OTLET_IMAGE:-otlet}:${OTLET_VERSION:-dev}
  build:
    context: ..
    dockerfile: deploy/Containerfile
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # The application connects as otlet_app, which cannot bypass row-level security (M-12).
  environment: &app-environment
    OTLET_DATABASE_URL: postgresql+psycopg://otlet_app:${OTLET_APP_PASSWORD:?run ./configure.sh --complete}@db:5432/otlet
    # Declarations of rights on texts reserved by their publisher (ADR-0039): off on a hosted
    # instance whose administrator does not take that risk.
    OTLET_RIGHTS_DECLARATIONS: ${OTLET_RIGHTS_DECLARATIONS:-on}

x-long-running: &long-running
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${OTLET_HTTP_PORT:-80}:80"
      - "${OTLET_HTTPS_PORT:-443}:443"
      - "${OTLET_HTTPS_PORT:-443}:443/udp"
    environment:
      OTLET_DOMAIN: ${OTLET_DOMAIN:?OTLET_DOMAIN is required (see .env.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin endpoint only listens inside the container.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: [*app, *long-running]
    command: ["api"]
    # The file storage: images of the articles (X03b); the root file system stays read-only.
    # The backups, read only: listed and downloaded in Réglages › Sauvegardes (ADR-0042).
    volumes:
      - files_data:/var/lib/otlet/files
      - ${OTLET_BACKUP_DIR:-./backups}:/backups:ro
    # The API seals secrets with the public key; it never receives the private key (DR6).
    environment:
      <<: *app-environment
      OTLET_SECRETS_PUBLIC_KEY_FILE: /run/secrets/secrets_public_key
      OTLET_BACKUP_DIR: /backups
    secrets:
      - secrets_public_key
    healthcheck:
      test: ["CMD", "otlet", "healthcheck", "api"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: [*app, *long-running]
    command: ["worker"]
    # Only container holding the private key: the worker alone opens secrets (DR6).
    environment:
      <<: *app-environment
      OTLET_SECRETS_PUBLIC_KEY_FILE: /run/secrets/secrets_public_key
      OTLET_SECRETS_PRIVATE_KEY_FILE: /run/secrets/secrets_private_key
    secrets:
      - secrets_public_key
      - secrets_private_key
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "otlet", "healthcheck", "worker"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Domain deadlines (ADR-0030): enqueues the source collections that are due. One leads at a
  # time (advisory lock), so a second instance would only wait.
  scheduler:
    <<: [*app, *long-running]
    command: ["scheduler"]
    healthcheck:
      test: ["CMD", "otlet", "healthcheck", "scheduler"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    <<: *app
    command: ["migrate", "upgrade"]
    restart: "no"
    # Migrations run as otlet_migrator, which creates objects as the schema owner (M-12).
    environment:
      OTLET_DATABASE_URL: postgresql+psycopg://otlet_migrator:${OTLET_MIGRATOR_PASSWORD:?run ./configure.sh --complete}@db:5432/otlet
    depends_on:
      provision:
        condition: service_completed_successfully

  # Roles of M-12, created or updated at every start with the superuser of the database, which
  # only this service and the backup use.
  provision:
    <<: *app
    command: ["db", "provision"]
    restart: "no"
    environment:
      OTLET_ADMIN_DATABASE_URL: postgresql://otlet:${POSTGRES_PASSWORD}@db:5432/otlet
      OTLET_MIGRATOR_PASSWORD: ${OTLET_MIGRATOR_PASSWORD:?run ./configure.sh --complete}
      OTLET_APP_PASSWORD: ${OTLET_APP_PASSWORD:?run ./configure.sh --complete}
    depends_on:
      backup:
        condition: service_completed_successfully

  # A complete backup at every start, hence before any migration (ARCHITECTURE §20.4, ADR-0042),
  # in OTLET_BACKUP_DIR (default: ./backups next to this file), with the owner role.
  backup:
    <<: *app
    command: ["backup", "run", "--reason", "startup"]
    restart: "no"
    # Root, with only the rights to read and write any folder: the destination may be a disk,
    # a mounted share or a synced folder, whoever owns it. Restored files go back to uid 10001.
    user: "0:0"
    cap_add: &backup-capabilities [DAC_OVERRIDE, DAC_READ_SEARCH, CHOWN]
    environment: &backup-environment
      OTLET_BACKUP_DATABASE_URL: postgresql://otlet:${POSTGRES_PASSWORD}@db:5432/otlet
      OTLET_BACKUP_DIR: /backups
      OTLET_BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      OTLET_SECRETS_PUBLIC_KEY_FILE: /run/secrets/secrets_public_key
      OTLET_SECRETS_PRIVATE_KEY_FILE: /run/secrets/secrets_private_key
    volumes:
      - ${OTLET_BACKUP_DIR:-./backups}:/backups
      - files_data:/var/lib/otlet/files:ro
    secrets: &backup-secrets
      - secrets_public_key
      - secrets_private_key
      - backup_passphrase
    depends_on:
      db:
        condition: service_healthy

  # The backup service (ADR-0042): the daily backup, « Sauvegarder maintenant », the state shown
  # in Réglages › Sauvegardes. A restore runs in it, the other services stopped:
  #   docker compose stop api worker scheduler
  #   docker compose exec backups otlet backup restore <name> --yes
  backups:
    <<: [*app, *long-running]
    command: ["backup", "serve"]
    user: "0:0"
    cap_add: *backup-capabilities
    environment: *backup-environment
    volumes:
      - ${OTLET_BACKUP_DIR:-./backups}:/backups
      - files_data:/var/lib/otlet/files
    secrets: *backup-secrets
    healthcheck:
      test: ["CMD", "otlet", "healthcheck", "backup"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: otlet
      POSTGRES_USER: otlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otlet -d otlet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

# Key pair generated by configure.sh (OTLET_KEYS_DIR, default: ./keys next to this file).
secrets:
  secrets_public_key:
    file: ${OTLET_KEYS_DIR:-./keys}/secrets-public.pem
  secrets_private_key:
    file: ${OTLET_KEYS_DIR:-./keys}/secrets-private.pem
  # Passphrase of the backups (ADR-0042), generated by configure.sh: keep a copy elsewhere.
  backup_passphrase:
    file: ${OTLET_KEYS_DIR:-./keys}/backup-passphrase

volumes:
  files_data:
  caddy_data:
  caddy_config:
  db_data:
